services:
  database:
    image: mysql:8.0
    container_name: cv_database
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cvdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cv_network

  backend:
    image: jamira2703/jamira-backend:v1
    container_name: cv_backend
    restart: always
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: cvdb
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cv_network

  frontend:
    image: jamira2703/jamira-frontend:v1
    container_name: cv_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cv_network

volumes:
  mysql_data:

networks:
  cv_network: